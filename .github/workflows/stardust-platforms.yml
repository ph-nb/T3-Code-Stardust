name: Stardust cross-platform builds

on:
  push:
    branches:
      - codex/stardust-cross-platform-ui
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Stardust ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            target: nsis
          - runner: windows-11-arm
            platform: win
            arch: arm64
            target: nsis
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ph-nb/T3-Code-Stardust
      VITE_RELEASE_CHANNEL: stable
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows Spectre libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ Build Tools were not found" }
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.${{ matrix.arch == 'arm64' && 'ARM64' || 'x86.x64' }}.Spectre", "--quiet", "--norestart" -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 3010)) { throw "Visual Studio Installer failed with exit code $($proc.ExitCode)" }
      - name: Install Linux prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick libfuse2t64
      - run: vp install --frozen-lockfile
      - name: Build installer
        run: vp run dist:desktop:artifact --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --target ${{ matrix.target }} --build-version 1.2.3
      - uses: actions/upload-artifact@v7
        with:
          name: Stardust-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
  android:
    name: Stardust Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: vp install --frozen-lockfile
      - run: vp run dist:stardust:android
      - uses: actions/upload-artifact@v7
        with:
          name: Stardust-android
          path: release/*.apk
          if-no-files-found: error
